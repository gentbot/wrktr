name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Changelog enforcement
  # ---------------------------------------------------------------------------
  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check CHANGELOG updated
        run: |
          git fetch origin main --depth=1
          if ! git diff --name-only origin/main...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "Error: CHANGELOG.md was not updated in this PR." >&2
            echo "Add the 'skip-changelog' label if this PR needs no entry." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Static analysis
  # ---------------------------------------------------------------------------
  shellcheck:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck worktree-functions.sh
          shellcheck install.sh
          shellcheck uninstall.sh
          shellcheck update.sh

  # ---------------------------------------------------------------------------
  # Test suite
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }}, bash ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — system bash (bash 5.x)
          - os: ubuntu-latest
            bash: system
          # macOS — system bash (bash 3.2, the macOS default)
          - os: macos-latest
            bash: "3.2"
          # macOS — Homebrew bash (bash 5.x, verifies nothing regressed on newer bash)
          - os: macos-latest
            bash: "5.x"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats-core and zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          sudo apt-get install -y zsh

      - name: Install bats-core and bash (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core bash

      # Each leg pins the interpreter explicitly and asserts its version, so the
      # "3.2" leg cannot silently run under a Homebrew bash that is earlier on PATH.
      - name: Run tests (Linux, system bash)
        if: runner.os == 'Linux'
        run: |
          echo "bash $BASH_VERSION, zsh $(zsh --version)"
          bats --tap tests/

      - name: Run tests (macOS, bash 3.2)
        if: matrix.bash == '3.2'
        run: |
          /bin/bash -c 'echo "bash $BASH_VERSION"; case "$BASH_VERSION" in 3.2.*) ;; *) echo "expected bash 3.2" >&2; exit 1;; esac'
          /bin/bash "$(which bats)" --tap tests/

      - name: Run tests (macOS, Homebrew bash 5.x)
        if: matrix.bash == '5.x'
        run: |
          BASH_BIN="$(brew --prefix)/bin/bash"
          "$BASH_BIN" -c 'echo "bash $BASH_VERSION"; case "$BASH_VERSION" in 5.*) ;; *) echo "expected bash 5.x" >&2; exit 1;; esac'
          "$BASH_BIN" "$(which bats)" --tap tests/
