name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches the script and CHANGELOG
        run: |
          version="${{ steps.version.outputs.version }}"
          script_version="$(sed -n 's/^export WRKTR_VERSION="\(.*\)"$/\1/p' worktree-functions.sh)"
          if [ "$script_version" != "$version" ]; then
            echo "Tag v$version does not match WRKTR_VERSION ($script_version) in worktree-functions.sh" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi

      - name: Extract changelog entry
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v hdr="## [$version]" \
            'index($0,hdr)==1{found=1;next} found && /^---/{exit} found{print}' \
            CHANGELOG.md > release_notes.txt

      - name: Generate checksum
        run: sha256sum worktree-functions.sh > worktree-functions.sh.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.txt \
            worktree-functions.sh \
            worktree-functions.sh.sha256
